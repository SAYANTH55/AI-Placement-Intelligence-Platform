version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount models folder to avoid rebuilding image on model update
      - ./backend/ai_model/models:/app/ai_model/models
      # Persist SQLite DB
      - sqlite_data:/app
    environment:
      - DATABASE_URL=sqlite:///ai_placement.db
      # - DATABASE_URL=postgresql://user:password@db:5432/jobmode
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
